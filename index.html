<!doctype html>

<html lang="en">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#0e1014">

<title>First Mile</title>

<style>

*{box-sizing:border-box}

body{margin:0;background:#0e1014;color:#f5f7fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}

#app{max-width:520px;margin:auto;min-height:100vh;padding:28px 18px 100px}

.brand{font-size:13px;letter-spacing:.16em;font-weight:900;color:#ffbf47}

h1{font-size:32px;margin:8px 0}

.sub{color:#aeb6c2;line-height:1.5;margin-bottom:22px}

.grid,.actions{display:grid;gap:12px}

button{font:inherit}

.btn,.choice{width:100%;border:1px solid #303743;background:#191d24;color:white;border-radius:18px;padding:18px;text-align:left;font-size:17px;font-weight:800}

.btn:active,.choice:active{transform:scale(.98);background:#222832}

.btn span{display:block}

.small{color:#aeb6c2;font-size:12px;font-weight:600;margin-top:5px}

.green{border-left:5px solid #55d68a}

.amber{border-left:5px solid #ffbf47}

.blue{border-left:5px solid #6fb7ff}

.red{border-left:5px solid #ff6b6b}

.purple{border-left:5px solid #b89cff}

.top{display:flex;gap:12px;align-items:center;margin-bottom:18px}

.back{width:44px;height:44px;border-radius:14px;border:1px solid #303743;background:#191d24;color:white;font-size:22px}

.st{font-size:23px;font-weight:900}

.card{background:#191d24;border:1px solid #303743;border-radius:18px;padding:18px;margin:12px 0}

.card h3{margin:0 0 8px}

.card p{margin:0;line-height:1.5;color:#d5dae1}

.tip{border-left:4px solid #ffbf47}

ul{padding-left:20px;line-height:1.6}

.footer{position:fixed;bottom:0;left:0;right:0;background:#0e1014ee;border-top:1px solid #303743;padding:10px 18px 18px;display:flex;gap:10px}

.foot{flex:1;border:1px solid #303743;background:#191d24;color:white;border-radius:14px;padding:12px;font-weight:800}

.ask{background:#ffbf47;color:#111;border:0}

.note{font-size:12px;color:#8f98a5;margin-top:18px;line-height:1.4}

</style>

</head>

<body>

<div id="app"></div>

<script>

let current="home",history=[];

const app=document.getElementById("app");

function page(title,body){

return `<div class="top">

<button class="back" onclick="back()">‹</button>

<div class="st">${title}</div>

</div>${body}`;

}

const screens={

home:()=>`

<div class="brand">FIRST MILE</div>

<h1>The Driver's Mate</h1>

<div class="sub">

No panic. No judgement. Just practical help.<br>

<b>Every driver starts somewhere.</b>

</div>

<div class="grid">

<button class="btn green" onclick="go('shift')">

🟢 STARTING MY SHIFT

<span class="small">Get sorted before the wheels turn.</span>

</button>

<button class="btn amber" onclick="go('delivery')">

🅿️ DELIVERY / COLLECTION

<span class="small">Arrive, check in, position and unload.</span>

</button>

<button class="btn blue" onclick="go('time')">

⏱️ KEEPING TRACK OF MY TIME

<span class="small">Watch both clocks.</span>

</button>

<button class="btn red" onclick="go('wrong')">

⚠️ SOMETHING'S GONE WRONG

<span class="small">Stop. Stay safe. Communicate.</span>

</button>

<button class="btn purple" onclick="go('basics')">

🎓 NEW DRIVER BASICS

<span class="small">The stuff somebody should just explain.</span>

</button>

</div>

<div class="note">

Prototype V1. Company procedures and current official guidance take priority.

</div>`,

delivery:()=>page("Delivery / Collection",`

<div class="card">

<h3>First job: don't rush.</h3>

<p>Pull up somewhere safe and appropriate. Keep access clear. Have your paperwork, booking details or reference ready.</p>

</div>

<div class="actions">

<button class="choice" onclick="go('arrived')">📍 I've arrived</button>

<button class="choice" onclick="go('lost')">🧭 I can't find the place</button>

<button class="choice" onclick="go('late')">⏰ I'm running late</button>

</div>`),

arrivedOld:()=>page("I've Arrived",`

<div class="card tip">

<h3>Before you jump out…</h3>

<p>Check site rules and required PPE. Hi-vis, boots, hard hat, glasses — requirements vary.</p>

</div>

<div class="card">

<h3>Find out where they want you.</h3>

<p>Reception, goods-in, gatehouse, security or whoever is unloading you. Don't guess and don't blindly follow the wagon in front.</p>

</div>

<div class="actions">

<button class="choice" onclick="go('where')">🤷 I don't know where to go</button>

<button class="choice" onclick="go('position')">🚛 They've told me where to position</button>

</div>`),
arrived:()=>page("I've Arrived",`

<div class="card">

<h3>First things first.</h3>

<p>Pull up somewhere safe and appropriate. Keep entrances, exits and access routes clear. Don't block pavements or commit the truck to somewhere you're not sure about.</p>

</div>

<div class="card tip">

<h3>Before you jump out...</h3>

<p>Check the site's rules and required PPE. Hi-vis is usually the minimum, but follow whatever the site requires.</p>

</div>

<div class="card">

<h3>Find the right person.</h3>

<p>Look for a forklift driver, reception, goods-in, gatehouse or security. Have your paperwork or delivery reference ready.</p>

</div>

<div class="card">

<h3>Before moving into position.</h3>

<p>Ask where they want you and how they want you positioned. If anything is unclear, ask before moving the truck.</p>

</div>

<div class="card tip">

<h3>Don't let anyone rush you.</h3>

<p>If you're unsure about the space, stop and GOAL — Get Out And Look. It's better to check twice than hit something once.</p>

</div>

<div class="actions">

<button class="choice" onclick="go('where')">🤷 I don't know where to go</button>

<button class="choice" onclick="go('position')">🚛 I know where they want me</button>

</div>`),
where:()=>page("I Don't Know Where To Go",`

<div class="card">

<h3>Totally normal.</h3>

<p>Look for reception, goods-in, gatehouse or security. If the forklift driver has disappeared into another dimension, ask somebody on site.</p>

</div>



<button class="choice" onclick="go('position')">👍 Found someone</button>`),

position:()=>page("Positioning The Wagon",`

<div class="card">

<h3>Before manoeuvring</h3>

<p>Ask exactly where they want the vehicle. Check pedestrians, space, obstructions and site rules.</p>

</div>

<div class="actions">

<button class="choice" onclick="go('reverse')">↩️ I need to reverse</button>

<button class="choice" onclick="go('unload')">✅ I'm positioned</button>

</div>`),

reverse:()=>page("Reversing",`

<div class="card tip">

<h3>GOAL — Get Out And Look.</h3>

<p>If you're not sure what's behind or beside you, stop and look. No rush. A delivery time isn't worth an accident.</p>

</div>

<div class="card">

<h3>Set yourself up.</h3>

<p>If you can, take the good-side reverse. If the angle is poor, ask if you can turn around or reposition first. A better setup usually makes the reverse easier and safer.</p>

</div>

<div class="card">
<h3>Banksman?</h3>

<p>If the site requires one, follow site procedure. If you lose sight of them: <b>STOP.</b></p>

</div>

<div class="card">

<h3>Brain freeze?</h3>

<p>Hands at the bottom of the wheel. Want the trailer left? Move your left hand upward. Trailer right? Right hand upward. Small corrections.</p>

</div>

<button class="choice" onclick="go('unload')">✅ I'm in position</button>`),

unload:()=>page("Ready For Unloading",`

<div class="card">

<h3>Follow the site's procedure.</h3>

<p>Find out what the site expects before unloading starts. You may be asked to stay in the cab, hand your keys in, leave them on display, or wait in a designated area. Every site is different — follow their procedure.</p>

</div>

<div class="card">

<h3>Before you leave</h3>

<ul>

<li>Correct goods unloaded?</li>

<li>Remaining load secure?</li>

<li>Straps or restraints sorted?</li>

<li>Curtains or doors secure?</li>

<li>Paperwork / POD sorted?</li>

</ul>

</div>

<button class="choice" onclick="go('home')">🚛 Job done</button>`),

lost:()=>page("Can't Find The Drop",`

<div class="card">

<h3>Don't commit to a bad road because a map says so.</h3>

<p>Stop somewhere safe. Check the address and instructions. Call the customer or office.</p>

</div>

<div class="card tip">

<p>On farms or rural drops, ask about the correct entrance and HGV access before disappearing down a single-track lane and becoming TikTok famous.</p>

</div>`),

late:()=>page("Running Late",`

<div class="card">

<h3>Don't try to win the time back on the road.</h3>

<p>Call the office as soon as you know you're going to be late. Give a realistic ETA and communicate rather than rush.</p>

</div>

<div class="card tip">

<p><b>A timed delivery isn't worth an accident.</b></p>

</div>`),


shift:()=>page("Starting My Shift",`

<div class="card">

<h3>Before the wheels turn</h3>

<p>Every company works slightly differently, but this is a good basic routine to get yourself organised.</p>

</div>

<div class="card">

<ul>

<li><b>Clock in</b> if your company requires it.</li>

<li><b>Collect your paperwork or job details.</b> Check where you're going and what you're carrying.</li>

<li><b>Get your keys and company device</b> if you're using one.</li>

<li><b>Check your vehicle and trailer details.</b> Make sure you've got the right unit, trailer and paperwork.</li>

<li><b>Insert your tacho card</b> and complete any required manual entry.</li>

<li><b>Do your daily walkaround check.</b> Use your company's paper or app system and report defects properly.</li>

<li><b>Check the load.</b> Make sure it's secure and, on multi-drop work, know which customer's goods are where.</li>

</ul>

</div>

<div class="card tip">

<h3>Don't rush the start.</h3>

<p>Five minutes getting organised now can save a lot of grief later. If something doesn't look right, ask before you move.</p>

</div>`),

time:()=>page("Keeping Track Of My Time",`

<div class="card">

<h3>Remember: two clocks.</h3>

<p>Your driving time and your working time can catch you at different points. Ask yourself: <b>which clock runs out first?</b></p>

</div>

<div class="card tip">

<p>Don't leave finding parking until the last second. Follow current rules and your company procedure.</p>

</div>

<div class="actions">

<button class="choice" onclick="go('drivingTime')">🚛 Driving time</button>

<button class="choice" onclick="go('workingTime')">🛠️ Working time</button>

<button class="choice" onclick="go('breaks')">☕ What counts as a break?</button>

</div>

</div>`),

drivingTime:()=>page("Driving Time",`

<div class="card">

<h3>Your driving clock.</h3>

<p>Keep an eye on how much driving you've actually done — not just how long you've been at work.</p>

<p>Under the standard assimilated rules, after no more than 4½ hours of driving you need a qualifying break before carrying on.</p>

</div>

<div class="card tip">

<p><b>Don't run it to the wire.</b><br><br>Start thinking about somewhere suitable to stop before your driving time is nearly gone.</p>

</div>

<a class="choice" href="https://www.gov.uk/guidance/drivers-hours-goods-vehicles/1-assimilated-and-aetr-rules-on-drivers-hours" target="_blank" rel="noopener noreferrer">

🔗 Check current GOV.UK guidance

</a>

`),

workingTime:()=>page("Working Time",`

<div class="card">

<h3>Your other clock.</h3>

<p>Driving isn't the only thing that counts as work. Loading, unloading, paperwork and other work can all keep this clock moving.</p>

<p>Under the standard road transport working-time rules, you must not work more than 6 consecutive hours without taking a qualifying break.</p>

</div>

<div class="card tip">

<h3>This one can catch you first.</h3>

<p>You might have plenty of driving time left but still be approaching a working-time break. Keep an eye on both.</p>

</div>

<a class="choice" href="https://www.gov.uk/guidance/drivers-hours-goods-vehicles/annex-2-working-time-rules" target="_blank" rel="noopener noreferrer">

🔗 Check current GOV.UK guidance

</a>

`),

breaks:()=>page("What Counts As A Break?",`

<div class="card">

<h3>A break means a break.</h3>

<p>No driving and no other work. It should be time you can actually use to rest and recover.</p>

</div>

<div class="card tip">

<h3>Don't accidentally ruin it.</h3>

<p>Paperwork, straps, curtains, unloading, vehicle checks or other job-related tasks are work — not break.</p>

</div>

<div class="card">

<h3>For your driving clock.</h3>

<p>A qualifying 45-minute driving break can be taken in one go, or split into at least 15 minutes followed by at least 30 minutes.</p>

</div>

<div class="card">

<h3>For your working-time clock.</h3>

<p>Working-time breaks must be at least 15 minutes long. The total break you need depends on how long you work.</p>

</div>

<div class="actions">

<a class="choice" href="https://www.gov.uk/guidance/drivers-hours-goods-vehicles/1-assimilated-and-aetr-rules-on-drivers-hours" target="_blank" rel="noopener noreferrer">

🔗 Check driving break rules

</a>

<a class="choice" href="https://www.gov.uk/guidance/drivers-hours-goods-vehicles/annex-2-working-time-rules" target="_blank" rel="noopener noreferrer">

🔗 Check working-time rules

</a>

</div>

`),

wrong:()=>page("Something's Gone Wrong",`

<div class="card tip">

<h3>STOP → SAFE → COMMUNICATE</h3>

<p>Don't make a stressful situation worse by rushing or guessing.</p>

</div>

<div class="actions">

<button class="choice" onclick="go('lost')">🧭 Lost / wrong entrance</button>

<button class="choice" onclick="go('late')">⏰ Running late</button>

<button class="choice" onclick="go('unsure')">📞 I'm unsure what to do</button>

</div>`),unsure:()=>page("I'm Unsure What To Do",`

<div class="card">

<h3>What are you unsure about?</h3>

<p>Pick the closest option. You don't need to guess your way through it.</p>

</div>

<div class="actions">

<button class="choice" onclick="go('customerUnsure')">🏭 I'm at a customer and don't know what they want</button>

<button class="choice">🚛 I'm not sure I can get the wagon somewhere safely</button>

<button class="choice">📦 There's a problem with the load or delivery</button>

<button class="choice">⏱️ I'm worried about my hours</button>

<button class="choice">🔧 There's a problem with the vehicle</button>

<button class="choice" onclick="ask()">🤷 Something else</button>

</div>

`),

customerUnsure:()=>page("Not Sure What The Customer Wants",`

<div class="card">

<h3>Stop and ask.</h3>

<p>Don't move the wagon or start unloading until you know what the site wants you to do.</p>

</div>

<div class="card tip">

<h3>Find the right person.</h3>

<p>Ask reception, goods-in, security or the person unloading you. Have your paperwork or reference ready.</p>

</div>

<div class="card">

<h3>Before you move.</h3>

<p>Ask where they want you positioned, whether there are any site rules you need to follow, and whether they want you to stay in the cab, hand your keys in or wait somewhere else.</p>

</div>

<div class="card">

<h3>Still not sure?</h3>

<p>Call your office rather than guessing.</p>

</div>

`),

basics:()=>page("New Driver Basics",`

<div class="card">

<h3>GOAL</h3>

<p><b>Get Out And Look.</b> Simple and useful.</p>

</div>

<div class="card">

<h3>BLACK — trailer memory aid</h3>

<p>Brake · Legs · Air · Clip · Kingpin.</p>

</div>

<div class="card">

<h3>Golden rule</h3>

<p>Never done it before? Ask. Experienced drivers ask too. There's no prize for pretending you know.</p>

</div>`)

};

function go(id){

if(id==="home"){

history=[];

}else{

history.push(current);

}

current=id;

render();

window.scrollTo(0,0);

}

function back(){

current=history.pop()||"home";

render();

window.scrollTo(0,0);

}

function ask(){

alert("NOT SURE? ASK.\n\nStop somewhere safe. Contact your office, ask somebody on site, or check the appropriate company or official guidance. Don't guess just to save face.");

}

function render(){

app.innerHTML=screens[current]()+`

<div class="footer">

<button class="foot" onclick="go('home')">🏠 Home</button>

<button class="foot ask" onclick="ask()">❓ ASK</button>

</div>`;

}

render();

</script>

</body>

</html>
